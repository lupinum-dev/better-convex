name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  RELEASE_NPM_VERSION: '11.18.0'

jobs:
  classify:
    name: Classify changes
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      pull-requests: read
    outputs:
      artifact: ${{ steps.paths.outputs.artifact }}
      full: ${{ steps.paths.outputs.full }}
    steps:
      - name: Select required lanes
        id: paths
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const runAll = context.eventName !== 'pull_request'
            const files = runAll
              ? []
              : await github.paginate(github.rest.pulls.listFiles, {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: context.issue.number,
                  per_page: 100,
                })
            const paths = files.map((file) => file.filename)
            const publicDocsOnly =
              paths.length > 0 &&
              paths.every((path) =>
                /^(?:docs\/|README\.md$|CONTRIBUTING\.md$|SECURITY\.md$|MAINTAINING\.md$|AGENTS\.md$|CLAUDE\.md$|LICENSE$)/u.test(path),
              )
            const releaseArtifactInputs = paths.some((path) =>
              /^(?:scripts\/(?:candidate-app-locks|create-release-candidate|prepare-candidate-app-locks|prepare-candidate-set|reconcile-release|release|release-intent|release-preflight-tarballs|release-smoke|test-lazy-release|test-release-workflow)\.mjs|\.github\/workflows\/(?:ci|publish-prerelease)\.yml)$/u.test(path),
            )
            core.setOutput('artifact', String(runAll || releaseArtifactInputs))
            core.setOutput('full', String(runAll || !publicDocsOnly))

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: trufflesecurity/trufflehog@27b0417c16317ca9a472a9a8092acce143b49c55 # v3.95.9
        with:
          path: ./
          base: ''
          head: HEAD
          version: 3.95.9
          extra_args: --only-verified

  compatibility:
    needs: classify
    if: needs.classify.outputs.full == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.19.0'
      - name: Update and enable Corepack
        run: npm install --global corepack@0.34.5 && corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify pinned Action commits
        run: node scripts/verify-action-shas.mjs
      - name: Install documentation dependencies
        working-directory: docs
        run: corepack pnpm install --frozen-lockfile --ignore-scripts
      - name: Install browser
        run: pnpm exec playwright install --with-deps chromium
      - name: Certify core source lane
        run: pnpm release:certify:source core

  dependency-matrix:
    needs: classify
    if: needs.classify.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: floor
            node: 22.19.0
          - profile: latest-compatible
            node: 22.19.0
          - profile: floor
            node: '24'
          - profile: latest-compatible
            node: '24'
    name: Packed dependencies (${{ matrix.profile }}, Node ${{ matrix.node }})
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - run: npm install --global npm@"$RELEASE_NPM_VERSION" corepack@0.34.5 && corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Verify exact tarballs in fresh consumers
        run: pnpm run check:compatibility-matrix "${{ matrix.profile }}"

  auth-contracts:
    needs: classify
    if: needs.classify.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.19.0'
          package-manager-cache: false
      - run: npm install --global corepack@0.34.5 && corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm check:auth-backend --install
      - name: Certify auth source lane
        run: pnpm release:certify:source auth
        env:
          GITHUB_TOKEN: ${{ github.token }}

  auth-real-backend:
    needs: classify
    if: needs.classify.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.19.0'
          package-manager-cache: false
      - run: npm install --global corepack@0.34.5 && corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm check:auth-backend --install
      - name: Certify end-to-end source lane
        run: pnpm release:certify:source e2e
        env:
          GITHUB_TOKEN: ${{ github.token }}

  deployable-app-audits:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.19.0'
          package-manager-cache: false
      - name: Audit docs production dependencies
        working-directory: docs
        run: corepack pnpm audit --prod
      - name: Audit demo production dependencies
        working-directory: demo
        run: corepack pnpm audit --prod

  release-smoke:
    needs: classify
    if: needs.classify.outputs.artifact == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.19.0'
          package-manager-cache: false
      - name: Install the release toolchain
        run: npm install --global npm@"$RELEASE_NPM_VERSION" corepack@0.34.5 && corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Verify release-equivalent packages and candidate locks
        run: pnpm release:smoke
      - name: Prepare Linux candidate locks after a mismatch
        if: failure()
        run: pnpm update:candidate-app-locks
      - name: Retain the Linux candidate locks for review
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: candidate-locks-${{ github.sha }}
          path: |
            demo/pnpm-lock.yaml
            starters/agency/pnpm-lock.yaml
            starters/mcp-oauth-agent/pnpm-lock.yaml
            starters/public/pnpm-lock.yaml
            starters/team/pnpm-lock.yaml
          if-no-files-found: error
          retention-days: 2

  source-certification:
    name: Source certification
    needs:
      [
        classify,
        secrets,
        compatibility,
        dependency-matrix,
        auth-contracts,
        auth-real-backend,
        deployable-app-audits,
        release-smoke,
      ]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every independent source lane
        env:
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          ARTIFACT: ${{ needs.classify.outputs.artifact }}
          FULL: ${{ needs.classify.outputs.full }}
          AUTH_CONTRACTS: ${{ needs.auth-contracts.result }}
          AUTH_REAL_BACKEND: ${{ needs.auth-real-backend.result }}
          COMPATIBILITY: ${{ needs.compatibility.result }}
          DEPENDENCY_MATRIX: ${{ needs.dependency-matrix.result }}
          DEPLOYABLE_APP_AUDITS: ${{ needs.deployable-app-audits.result }}
          RELEASE_SMOKE: ${{ needs.release-smoke.result }}
          SECRETS: ${{ needs.secrets.result }}
        run: |
          test "$CLASSIFY_RESULT" = success
          case "$FULL" in
            true | false) ;;
            *) echo "Invalid classifier output: $FULL" >&2; exit 1 ;;
          esac
          case "$ARTIFACT" in
            true | false) ;;
            *) echo "Invalid artifact classifier output: $ARTIFACT" >&2; exit 1 ;;
          esac
          test "$SECRETS" = success
          test "$DEPLOYABLE_APP_AUDITS" = success
          for result in "$COMPATIBILITY" "$DEPENDENCY_MATRIX" "$AUTH_CONTRACTS" "$AUTH_REAL_BACKEND"; do
            if [ "$FULL" = true ]; then test "$result" = success; else test "$result" = skipped; fi
          done
          if [ "$ARTIFACT" = true ]; then test "$RELEASE_SMOKE" = success; else test "$RELEASE_SMOKE" = skipped; fi

  release-candidate:
    name: Release candidate
    needs: source-certification
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.source-certification.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.19.0'
          package-manager-cache: false
      - name: Install the pinned release toolchain
        run: npm install --global npm@"$RELEASE_NPM_VERSION" corepack@0.34.5 && corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Derive the unique incomplete release intent
        id: intent
        run: node scripts/release-intent.mjs --github-output "$GITHUB_OUTPUT" --summary "$GITHUB_STEP_SUMMARY"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Verify reviewed release ownership and identity
        if: steps.intent.outputs.ready == 'true'
        run: pnpm check:security-governance --release
        env:
          BCN_GOVERNANCE_MODE: solo-maintainer
          RELEASE_OWNER: ${{ github.actor }}
          RELEASE_TAG: ${{ steps.intent.outputs.tag }}
          RELEASE_TARGET: ${{ steps.intent.outputs.unit }}
      - name: Resolve Vue/Nuxt artifact coordinates
        if: steps.intent.outputs.ready == 'true' && steps.intent.outputs.unit == 'vue-nuxt'
        id: candidate_set
        run: node scripts/print-candidate-set-coordinates.mjs >> "$GITHUB_OUTPUT"
      - name: Resolve MCP artifact coordinates
        if: steps.intent.outputs.ready == 'true' && steps.intent.outputs.unit == 'mcp'
        id: mcp
        run: node scripts/print-package-artifact-coordinates.mjs --package mcp >> "$GITHUB_OUTPUT"
      - name: Build the Vue/Nuxt unit once
        if: steps.intent.outputs.ready == 'true' && steps.intent.outputs.unit == 'vue-nuxt'
        run: pnpm release:artifact:set
      - name: Build the MCP unit once
        if: steps.intent.outputs.ready == 'true' && steps.intent.outputs.unit == 'mcp'
        run: node scripts/release.mjs artifact --package mcp && node scripts/release-target.mjs write-mcp-metadata
      - name: Verify the Vue/Nuxt unit
        if: steps.intent.outputs.ready == 'true' && steps.intent.outputs.unit == 'vue-nuxt'
        run: pnpm release:verify:set "${{ steps.candidate_set.outputs.evidence }}"
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Install the reviewed MCP conformance backend
        if: steps.intent.outputs.ready == 'true' && steps.intent.outputs.unit == 'mcp'
        run: pnpm check:auth-backend --install
      - name: Install the reviewed MCP conformance browser
        if: steps.intent.outputs.ready == 'true' && steps.intent.outputs.unit == 'mcp'
        run: pnpm exec playwright install --with-deps chromium
      - name: Verify the MCP unit
        if: steps.intent.outputs.ready == 'true' && steps.intent.outputs.unit == 'mcp'
        run: pnpm release:verify --package mcp --artifact-manifest "${{ steps.mcp.outputs.evidence }}"
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Create the immutable release record
        if: steps.intent.outputs.ready == 'true'
        run: node scripts/create-release-candidate.mjs "${{ steps.intent.outputs.unit }}"
      - name: Retain the exact release candidate
        if: steps.intent.outputs.ready == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-candidate
          path: .release-candidate/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 90

  release-gate:
    needs: [source-certification, release-candidate]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require source certification and the main candidate decision
        env:
          SOURCE_CERTIFICATION: ${{ needs.source-certification.result }}
          RELEASE_CANDIDATE: ${{ needs.release-candidate.result }}
        run: |
          test "$SOURCE_CERTIFICATION" = success
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            test "$RELEASE_CANDIDATE" = success
          else
            test "$RELEASE_CANDIDATE" = skipped
          fi
