name: ci

on:
  pull_request:
  push:
    branches: [main]
  # release.yml starts this workflow on the Version packages PR, because pull
  # requests opened with GITHUB_TOKEN trigger no workflows on their own.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The fast checks. Together with `build` they are what `pnpm verify` runs locally.
  check:
    name: ${{ matrix.task }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        task: [lint, typecheck, test, audit]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          # lint compares the pull request with origin/main to require a changeset.
          fetch-depth: ${{ matrix.task == 'lint' && '0' || '1' }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm install --global corepack@0.34.5 && corepack enable
      - if: matrix.task != 'audit'
        run: pnpm install --frozen-lockfile
      - if: matrix.task == 'test'
        run: pnpm exec playwright install --with-deps chromium
      - if: matrix.task != 'audit'
        run: pnpm ${{ matrix.task }}
      # High and critical only, for the package, the docs site and the demo, which each have a lockfile.
      - if: matrix.task == 'audit'
        run: |
          pnpm audit --audit-level=high
          pnpm --dir docs audit --audit-level=high
          pnpm --dir demo audit --audit-level=high

  # Builds the packages and the docs (the agent docs ship inside the packages), then
  # checks the packed tarballs: publint, attw, every public entry imports, no secrets,
  # the consumer type fixtures, and that an auth-disabled app bundles no auth code.
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm install --global corepack@0.34.5 && corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test:packed

  # Real-backend auth, OAuth and MCP suites and the beta-to-1.0 upgrade, on the
  # pinned local Convex backend. No cloud deployment or credential is involved.
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm install --global corepack@0.34.5 && corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:integration

  # Full-stack playground journeys, including test/e2e/extended, on the local backend.
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm install --global corepack@0.34.5 && corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e --full
        env:
          CONVEX_E2E_AUTO_START: 'true'
          BCN_E2E_REQUIRE_LOCAL: 'true'

  # The downloadable starters and the packed Vue, Nuxt and MCP consumer apps,
  # installed from freshly packed local tarballs instead of the npm registry.
  starters:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm install --global corepack@0.34.5 && corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:starters

  # Breaks each security guard in memory (test/mutants/mutants.ts) and checks that
  # the tests named for it fail. No path filter: a test change can weaken a guard too.
  mutants:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm install --global corepack@0.34.5 && corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:mutants

  # The one required status check for the main branch ruleset.
  ci:
    name: ci
    if: always()
    needs: [check, build, integration, e2e, starters, mutants]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do test "$result" = success; done
