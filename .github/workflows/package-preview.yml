name: package-preview

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch: {}

concurrency:
  group: package-preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  RELEASE_NODE_VERSION: '22.14.0'
  RELEASE_NPM_VERSION: '11.18.0'

jobs:
  preview:
    # Fork code is never executed by this upload path. Maintainers can instead
    # review it and move it to an in-repository branch before opening a PR.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.RELEASE_NODE_VERSION }}
          package-manager-cache: false

      - name: Install pinned release tooling
        run: npm install --global npm@"$RELEASE_NPM_VERSION" corepack@0.34.5 && corepack enable

      - name: Install dependencies from the frozen lockfile
        run: pnpm install --frozen-lockfile

      - name: Build the disposable Vue, Nuxt, and MCP preview set
        id: artifact
        run: node scripts/build-package-preview.mjs

      - name: Upload the exact prebuilt tarballs to pkg.pr.new
        id: publish
        shell: bash
        env:
          PREVIEW_MANIFEST: ${{ steps.artifact.outputs.manifest }}
        run: |
          mapfile -t TARBALLS < <(node -e "const m=require('./' + process.env.PREVIEW_MANIFEST); for (const p of m.packages) console.log(p.tarball)")
          pnpm exec pkg-pr-new publish \
            --no-compact \
            --comment=update \
            --commentWithSha \
            --no-template \
            --packageManager=pnpm,npm \
            "${TARBALLS[@]}"

      - name: Verify the hosted preview URLs and bytes
        env:
          PREVIEW_SHA: ${{ steps.publish.outputs.sha }}
          PREVIEW_URLS: ${{ steps.publish.outputs.urls }}
          SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/verify-package-preview.mjs "${{ steps.artifact.outputs.manifest }}"

      - name: Retain the disposable preview tarballs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-preview-${{ github.run_id }}
          path: ${{ steps.artifact.outputs.directory }}/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14

      - name: Write preview summary
        env:
          PREVIEW_SHA: ${{ steps.publish.outputs.sha }}
          PREVIEW_URLS: ${{ steps.publish.outputs.urls }}
          SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          {
            echo '## Commit-addressed package preview'
            echo
            echo "Source commit: \`$SOURCE_COMMIT\`"
            echo
            echo "Preview commit: \`$PREVIEW_SHA\`"
            echo
            echo 'Install URLs:'
            echo
            echo "\`$PREVIEW_URLS\`"
          } >> "$GITHUB_STEP_SUMMARY"
