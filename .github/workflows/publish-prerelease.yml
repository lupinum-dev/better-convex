name: publish-prerelease

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publish-better-convex
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Verify retained release candidate
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    outputs:
      action: ${{ steps.state.outputs.action }}
      channel: ${{ steps.state.outputs.channel }}
      first-attempt: ${{ steps.state.outputs.first-attempt }}
      sha: ${{ steps.state.outputs.sha }}
      tag: ${{ steps.state.outputs.tag }}
      unit: ${{ steps.state.outputs.unit }}
      version: ${{ steps.state.outputs.version }}
    steps:
      - name: Select one unique incomplete CI candidate
        id: ci
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const readJson = async (path, ref) => {
              const response = await github.rest.repos.getContent({ ...context.repo, path, ref })
              if (Array.isArray(response.data) || response.data.type !== 'file') throw new Error(`Missing ${path} at ${ref}.`)
              return JSON.parse(Buffer.from(response.data.content, response.data.encoding).toString('utf8'))
            }
            const readText = async (path, ref) => {
              const response = await github.rest.repos.getContent({ ...context.repo, path, ref })
              if (Array.isArray(response.data) || response.data.type !== 'file') throw new Error(`Missing ${path} at ${ref}.`)
              return Buffer.from(response.data.content, response.data.encoding).toString('utf8')
            }
            if (context.eventName === 'workflow_dispatch') {
              const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
                ...context.repo,
                workflow_id: 'ci.yml',
                status: 'success',
                event: 'push',
                branch: 'main',
                per_page: 100,
              })
              const retained = []
              const incomplete = []
              for (const run of runs) {
                const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, { ...context.repo, run_id: run.id, per_page: 100 })
                if (!artifacts.some(artifact => artifact.name === 'release-candidate' && artifact.expired === false)) continue
                const root = await readJson('package.json', run.head_sha)
                const vue = await readJson('packages/vue/package.json', run.head_sha)
                const mcp = await readJson('packages/mcp/package.json', run.head_sha)
                if (root.version !== vue.version) throw new Error(`Vue/Nuxt coupling failed at ${run.head_sha}.`)
                const changelog = await readText('CHANGELOG.md', run.head_sha)
                const units = [
                  { tag: `v${root.version}`, version: root.version, packages: ['@lupinum/better-convex-vue', '@lupinum/better-convex-nuxt'] },
                  { tag: `mcp-v${mcp.version}`, version: mcp.version, packages: ['@lupinum/better-convex-mcp'] },
                ].filter(unit => changelog.split('\n').some(line => line === `## ${unit.tag}` || line.startsWith(`## ${unit.tag} `)))
                const incompleteUnits = []
                for (const unit of units) {
                  let releaseIncomplete = false
                  for (const name of unit.packages) {
                    const response = await fetch(`https://registry.npmjs.org/${name.replace('/', '%2f')}/${unit.version}`)
                    if (response.status === 404) releaseIncomplete = true
                    else if (!response.ok) throw new Error(`npm state for ${name}@${unit.version} is unavailable: HTTP ${response.status}.`)
                  }
                  const tag = await github.rest.git.getRef({ ...context.repo, ref: `tags/${unit.tag}` }).catch(error => error.status === 404 ? null : Promise.reject(error))
                  const release = await github.rest.repos.getReleaseByTag({ ...context.repo, tag: unit.tag }).catch(error => error.status === 404 ? null : Promise.reject(error))
                  if (!tag || !release) releaseIncomplete = true
                  if (releaseIncomplete) incompleteUnits.push(unit)
                }
                if (incompleteUnits.length > 1) throw new Error(`Run ${run.id} contains multiple incomplete release units (${incompleteUnits.map(unit => unit.tag).join(', ')}). Finish the earlier release first.`)
                retained.push(run)
                if (incompleteUnits.length === 1) incomplete.push(run)
              }
              if (incomplete.length > 1) throw new Error(`Multiple incomplete retained candidates exist (${incomplete.map(run => run.id).join(', ')}). Finish the earlier release first.`)
              const selected = incomplete[0] ?? retained[0]
              if (!selected) throw new Error('No retained release candidate is available for reconciliation.')
              core.setOutput('active', 'true')
              core.setOutput('run-id', String(selected.id))
              core.setOutput('sha', selected.head_sha)
            } else {
              const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
                ...context.repo,
                run_id: context.payload.workflow_run.id,
                per_page: 100,
              })
              const candidate = artifacts.find(artifact => artifact.name === 'release-candidate' && artifact.expired === false)
              if (!candidate) {
                core.notice('CI produced no release candidate. The publication workflow is a clean no-op.')
                core.setOutput('active', 'false')
                return
              }
              core.setOutput('active', 'true')
              core.setOutput('run-id', String(context.payload.workflow_run.id))
              core.setOutput('sha', context.payload.workflow_run.head_sha)
            }

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        if: steps.ci.outputs.active == 'true'
        with:
          ref: ${{ steps.ci.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.ci.outputs.active == 'true'
        with:
          node-version: '24.11.0'
          package-manager-cache: false
          registry-url: https://registry.npmjs.org
      - name: Install locked verification dependencies
        if: steps.ci.outputs.active == 'true'
        run: npm install --global corepack@0.34.5 && corepack enable && pnpm install --frozen-lockfile --ignore-scripts
      - name: Download the exact retained candidate
        if: steps.ci.outputs.active == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          name: release-candidate
          path: .release
          run-id: ${{ steps.ci.outputs.run-id }}
      - name: Verify npm, provenance, GitHub history, and retained bytes
        id: state
        if: steps.ci.outputs.active == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/reconcile-release.mjs .release --summary "$GITHUB_STEP_SUMMARY" --github-output "$GITHUB_OUTPUT"
      - name: Verify release artifact handoff
        if: steps.ci.outputs.active == 'true'
        run: echo 'release-artifact verify' && node scripts/reconcile-release.mjs .release --probe
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Upload the verified release plan
        if: steps.ci.outputs.active == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-better-convex-release
          path: .release
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14

  publish-packages:
    name: Publish exact Better Convex artifacts
    needs: verify
    if: needs.verify.outputs.action == 'publish'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: npm
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - name: Recheck current main immediately before first publication
        if: needs.verify.outputs.first-attempt == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.verify.outputs.sha }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha > "$RUNNER_TEMP/main-sha"
          grep -Fx "$SOURCE_SHA" "$RUNNER_TEMP/main-sha"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.11.0'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Download the verified release plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified-better-convex-release
          path: .release
      - name: Publish only absent retained tarballs
        env:
          RELEASE_CHANNEL: ${{ needs.verify.outputs.channel }}
          RELEASE_VERSION: ${{ needs.verify.outputs.version }}
          SOURCE_SHA: ${{ needs.verify.outputs.sha }}
        run: |
          node --input-type=module <<'NODE'
          import { spawnSync } from 'node:child_process'
          import { createHash } from 'node:crypto'
          import { readFileSync } from 'node:fs'
          import { join } from 'node:path'
          const fail = message => { throw new Error(message) }
          const run = (args, inherit = false) => spawnSync('npm', args, { encoding: 'utf8', stdio: inherit ? 'inherit' : ['ignore', 'pipe', 'pipe'] })
          const view = (spec, field) => {
            const result = run(['view', spec, field, '--json'])
            if (result.status === 0) return JSON.parse(result.stdout.trim() || 'null')
            if (/E404|404 Not Found/u.test(result.stderr)) return null
            fail(`npm view failed for ${spec} ${field}: ${result.stderr.trim()}`)
          }
          const record = JSON.parse(readFileSync('.release/release-record.json', 'utf8'))
          const verification = JSON.parse(readFileSync('.release/registry-verification.json', 'utf8'))
          if (record.sourceSha !== process.env.SOURCE_SHA || record.version !== process.env.RELEASE_VERSION || record.channel !== process.env.RELEASE_CHANNEL) fail('Protected release coordinates differ.')
          if (JSON.stringify(record.publishOrder) !== JSON.stringify(record.packages.map(pkg => pkg.name))) fail('Publish order differs.')
          const verified = new Map(verification.packages.map(pkg => [pkg.name, pkg]))
          for (const pkg of record.packages) {
            const evidence = verified.get(pkg.name)
            if (!evidence || evidence.version !== pkg.version || evidence.integrity !== pkg.integrity || evidence.sha256 !== pkg.sha256) fail(`${pkg.name} verification differs.`)
            const tarball = join('.release', pkg.tarball)
            const bytes = readFileSync(tarball)
            if (createHash('sha256').update(bytes).digest('hex') !== pkg.sha256 || `sha512-${createHash('sha512').update(bytes).digest('base64')}` !== pkg.integrity) fail(`${pkg.name} retained bytes differ.`)
            const spec = `${pkg.name}@${pkg.version}`
            const existing = view(spec, 'dist.integrity')
            if (evidence.mode === 'absent') {
              if (existing !== null) fail(`${spec} changed after verification; rerun the unprivileged verifier.`)
              const result = run(['publish', tarball, '--access', 'public', '--tag', record.channel, '--ignore-scripts', '--provenance'], true)
              if (result.status !== 0) fail(`npm publish failed for ${spec}.`)
            } else if (existing !== pkg.integrity || view(pkg.name, `dist-tags.${record.channel}`) !== pkg.version || !view(spec, 'dist.attestations')) fail(`${spec} lost verified registry state.`)
          }
          NODE

  verify-publication:
    name: Verify published bytes and provenance
    needs: [verify, publish-packages]
    if: >-
      always() && needs.verify.result == 'success' &&
      (needs.verify.outputs.action == 'publish' || needs.verify.outputs.action == 'repair') &&
      (needs.publish-packages.result == 'success' || needs.publish-packages.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.verify.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.11.0'
          package-manager-cache: false
      - name: Install locked verification dependencies
        run: npm install --global corepack@0.34.5 && corepack enable && pnpm install --frozen-lockfile --ignore-scripts
      - name: Download the verified release plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified-better-convex-release
          path: .release
      - name: Cryptographically verify the published registry state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for delay in 0 5 10 20 40 60; do
            sleep "$delay"
            : > "$RUNNER_TEMP/reconcile-output"
            if node scripts/reconcile-release.mjs .release --github-output "$RUNNER_TEMP/reconcile-output" &&
              grep -Eq '^action=(repair|complete)$' "$RUNNER_TEMP/reconcile-output" &&
              node --input-type=module -e "import { readFileSync } from 'node:fs'; const state = JSON.parse(readFileSync('.release/registry-verification.json', 'utf8')); if (!state.packages.every(pkg => pkg.mode === 'oidc')) process.exit(1)"; then
              node scripts/reconcile-release.mjs .release --summary "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          done
          echo 'npm did not expose the certified bytes, channel, and provenance before the bounded verification deadline.' >&2
          exit 1
      - name: Retain the provenance-verified release plan
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: publication-verified-better-convex-release
          path: .release
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14

  github-release:
    name: Reconcile GitHub release
    needs: [verify, verify-publication]
    if: >-
      always() && needs.verify.result == 'success' &&
      (needs.verify.outputs.action == 'publish' || needs.verify.outputs.action == 'repair') &&
      needs.verify-publication.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download the verified release plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: publication-verified-better-convex-release
          path: .release
      - name: Create or repair the exact tag and Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_CHANNEL: ${{ needs.verify.outputs.channel }}
          RELEASE_TAG: ${{ needs.verify.outputs.tag }}
          SOURCE_SHA: ${{ needs.verify.outputs.sha }}
        run: |
          set -euo pipefail
          # Registry verification is derived live evidence, not a certified build asset.
          rm -f .release/registry-verification.json
          node --input-type=module <<'NODE'
          import { spawnSync } from 'node:child_process'
          import { createHash } from 'node:crypto'
          import { readFileSync } from 'node:fs'
          const record = JSON.parse(readFileSync('.release/release-record.json', 'utf8'))
          const run = args => spawnSync('npm', args, { encoding: 'utf8' })
          for (const pkg of record.packages) {
            const result = run(['view', `${pkg.name}@${pkg.version}`, 'dist.integrity', '--json'])
            if (result.status !== 0 || JSON.parse(result.stdout) !== pkg.integrity) throw new Error(`${pkg.name} registry bytes differ from the retained artifact.`)
            if (`sha512-${createHash('sha512').update(readFileSync(`.release/${pkg.tarball}`)).digest('base64')}` !== pkg.integrity) throw new Error(`${pkg.name} retained bytes differ.`)
          }
          NODE
          release_status=$(curl --silent --show-error --output /dev/null --write-out "%{http_code}" --header "Authorization: Bearer $GH_TOKEN" --header "Accept: application/vnd.github+json" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG")
          case "$release_status" in 200) release_exists=true ;; 404) release_exists=false ;; *) echo "Could not verify GitHub Release state (HTTP $release_status)" >&2; exit 1 ;; esac
          tag_status=$(curl --silent --show-error --output /dev/null --write-out "%{http_code}" --header "Authorization: Bearer $GH_TOKEN" --header "Accept: application/vnd.github+json" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG")
          case "$tag_status" in
            200) ;;
            404)
              [ "$release_exists" = false ]
              tag_error=$(mktemp)
              if ! gh api --silent --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$RELEASE_TAG" -f sha="$SOURCE_SHA" 2>"$tag_error"; then
                if grep -Eq 'Resource not accessible by integration|HTTP 403' "$tag_error"; then
                  echo "HUMAN-ONLY: GitHub could not create historical tag $RELEASE_TAG at certified commit $SOURCE_SHA." >&2
                  echo "Run: git fetch origin && git tag $RELEASE_TAG $SOURCE_SHA && git push origin refs/tags/$RELEASE_TAG" >&2
                  echo "Verify: test \"\$(git ls-remote origin refs/tags/$RELEASE_TAG | cut -f1)\" = \"$SOURCE_SHA\"" >&2
                  echo "Then rerun only this failed Release job. Do not rebuild or republish." >&2
                fi
                cat "$tag_error" >&2
                exit 1
              fi ;;
            *) echo "Could not verify tag state (HTTP $tag_status)" >&2; exit 1 ;;
          esac
          tag_type=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq .object.type)
          tag_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq .object.sha)
          while [ "$tag_type" = tag ]; do
            tag_type=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_sha" --jq .object.type)
            tag_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_sha" --jq .object.sha)
          done
          test "$tag_type" = commit
          test "$tag_sha" = "$SOURCE_SHA"
          prerelease=false
          [ "$RELEASE_CHANNEL" = next ] && prerelease=true
          if [ "$release_exists" = true ]; then
            gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null
            while IFS= read -r asset; do
              if [ ! -f ".release/$asset" ]; then
                gh release delete-asset "$RELEASE_TAG" "$asset" --repo "$GITHUB_REPOSITORY" --yes
              fi
            done < <(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
            gh release upload "$RELEASE_TAG" .release/* --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --title "Better Convex $RELEASE_TAG" --notes-file .release/github-release-notes.md --prerelease="$prerelease"
          else
            flags=()
            [ "$prerelease" = true ] && flags=(--prerelease)
            gh release create "$RELEASE_TAG" .release/* --repo "$GITHUB_REPOSITORY" --verify-tag --title "Better Convex $RELEASE_TAG" --notes-file .release/github-release-notes.md "${flags[@]}"
          fi

  verify-completed-release:
    name: Verify completed Better Convex release
    needs: [verify, github-release]
    if: >-
      always() && needs.verify.result == 'success' &&
      (needs.verify.outputs.action == 'publish' || needs.verify.outputs.action == 'repair') &&
      needs.github-release.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.verify.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.11.0'
          package-manager-cache: false
      - name: Install locked verification dependencies
        run: npm install --global corepack@0.34.5 && corepack enable && pnpm install --frozen-lockfile --ignore-scripts
      - name: Download the publication-verified release plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: publication-verified-better-convex-release
          path: .release
      - name: Prove the completed npm, tag, Release, metadata, and asset state
        id: state
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/reconcile-release.mjs .release --summary "$GITHUB_STEP_SUMMARY" --github-output "$GITHUB_OUTPUT"
      - name: Require a complete release
        env:
          ACTION: ${{ steps.state.outputs.action }}
        run: test "$ACTION" = complete
