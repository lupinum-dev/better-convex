name: publish-prerelease

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact Nuxt and Vue prerelease version
        required: true
        type: string
      bootstrap_packages:
        description: Comma-separated packages explicitly authorized for first-version bootstrap recovery
        required: false
        default: ''
        type: string

concurrency:
  group: publish-better-convex
  cancel-in-progress: false

permissions:
  checks: read
  contents: read

env:
  BCN_RELEASE_DIST_TAG: next
  RELEASE_NODE_VERSION: '22.14.0'
  RELEASE_NPM_VERSION: '11.18.0'

jobs:
  preflight-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.RELEASE_NODE_VERSION }}
          package-manager-cache: false
      - name: Require current main and the exact prerelease version
        env:
          BOOTSTRAP_PACKAGES: ${{ inputs.bootstrap_packages }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          test "$GITHUB_REF" = refs/heads/main
          test "$(node -p "require('./package.json').version")" = "$RELEASE_VERSION"
          case "$RELEASE_VERSION" in *-*) ;; *) exit 1 ;; esac
          node -e "const allowed=new Set(['@lupinum/better-convex-vue','@lupinum/better-convex-nuxt','@lupinum/better-convex-mcp']); const requested=(process.env.BOOTSTRAP_PACKAGES||'').split(',').map(value=>value.trim()).filter(Boolean); if(new Set(requested).size!==requested.length||requested.some(name=>!allowed.has(name))) throw new Error('bootstrap_packages must contain unique Better Convex package names.')"
      - name: Require an unused release tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          status=$(curl --silent --show-error --output /dev/null --write-out "%{http_code}" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/git/ref/tags/v$RELEASE_VERSION")
          test "$status" = 404
      - run: npm install --global npm@"$RELEASE_NPM_VERSION" corepack@0.34.5 && corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Run the disposable lock and package smoke
        run: pnpm release:smoke

  source-certification:
    needs: preflight-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.RELEASE_NODE_VERSION }}
          package-manager-cache: false
      - name: Require the exact commit's authoritative hosted certification
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/assert-hosted-source-certification.mjs

  build-candidates:
    needs: release-security
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.RELEASE_NODE_VERSION }}
          package-manager-cache: false

      - name: Install pinned release tooling
        run: npm install --global npm@"$RELEASE_NPM_VERSION" corepack@0.34.5 && corepack enable

      - name: Verify protected prerelease identity
        env:
          BCN_GOVERNANCE_MODE: solo-maintainer
          RELEASE_OWNER: ${{ github.actor }}
          RELEASE_TAG: v${{ inputs.version }}
        run: pnpm check:security-governance --prerelease

      - run: pnpm install --frozen-lockfile

      - name: Resolve the reviewed Vue/Nuxt candidate-set coordinates
        id: candidate_set
        run: node scripts/print-candidate-set-coordinates.mjs >> "$GITHUB_OUTPUT"

      - name: Build the immutable Vue/Nuxt candidate set once
        run: pnpm release:artifact:set

      - name: Upload the immutable Vue/Nuxt candidate set
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.candidate_set.outputs.artifact_name }}
          path: |
            ${{ steps.candidate_set.outputs.vue_directory }}/
            ${{ steps.candidate_set.outputs.nuxt_directory }}/
            ${{ steps.candidate_set.outputs.set_directory }}/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 90

      - name: Resolve the reviewed MCP artifact coordinates
        id: mcp
        run: node scripts/print-package-artifact-coordinates.mjs --package mcp >> "$GITHUB_OUTPUT"

      - name: Build the immutable MCP candidate once
        run: node scripts/release.mjs artifact --package mcp

      - name: Upload the immutable MCP candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.mcp.outputs.artifact_name }}
          path: ${{ steps.mcp.outputs.directory }}/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 90

  release-security:
    needs: source-certification
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan the release source for verified secrets
        uses: trufflesecurity/trufflehog@27b0417c16317ca9a472a9a8092acce143b49c55 # v3.95.9
        with:
          path: ./
          base: ''
          head: HEAD
          version: 3.95.9
          extra_args: --only-verified

      - name: Initialize release CodeQL analysis
        uses: github/codeql-action/init@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4
        with:
          languages: javascript-typescript

      - name: Analyze the exact release source
        uses: github/codeql-action/analyze@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4

  verify-candidates:
    needs: build-candidates
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.RELEASE_NODE_VERSION }}
          package-manager-cache: false

      - name: Install pinned verification tooling
        run: npm install --global npm@"$RELEASE_NPM_VERSION" corepack@0.34.5 && corepack enable

      - run: pnpm install --frozen-lockfile

      - name: Install the packed-consumer browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Install the reviewed local Convex backend
        run: pnpm check:auth-backend --install

      - name: Resolve the reviewed candidate coordinates
        id: candidate_set
        run: node scripts/print-candidate-set-coordinates.mjs >> "$GITHUB_OUTPUT"

      - name: Resolve the reviewed MCP coordinates
        id: mcp
        run: node scripts/print-package-artifact-coordinates.mjs --package mcp >> "$GITHUB_OUTPUT"

      - name: Resolve the reviewed Vue coordinates
        id: vue
        run: node scripts/print-package-artifact-coordinates.mjs --package vue >> "$GITHUB_OUTPUT"

      - name: Resolve the reviewed Nuxt coordinates
        id: nuxt
        run: node scripts/print-package-artifact-coordinates.mjs --package nuxt >> "$GITHUB_OUTPUT"

      - name: Download the exact Vue/Nuxt candidate set
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ steps.candidate_set.outputs.artifact_name }}
          path: ${{ steps.candidate_set.outputs.directory }}

      - name: Download the exact MCP candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ steps.mcp.outputs.artifact_name }}
          path: ${{ steps.mcp.outputs.directory }}

      - name: Verify the exact Vue/Nuxt candidate set bytes
        run: pnpm release:verify:set "${{ steps.candidate_set.outputs.evidence }}"
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Certify the exact Vue candidate
        run: >-
          pnpm release:verify
          --package vue
          --artifact-manifest "${{ steps.vue.outputs.evidence }}"
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Certify the exact Nuxt candidate
        run: >-
          pnpm release:verify
          --package nuxt
          --artifact-manifest "${{ steps.nuxt.outputs.evidence }}"
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Verify the exact MCP candidate bytes
        run: >-
          pnpm release:verify
          --package mcp
          --artifact-manifest "${{ steps.mcp.outputs.evidence }}"
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Record the artifact-only verification boundary
        run: |
          {
            echo '## Exact artifact verification'
            echo
            echo 'Full source certification completed once before minting.'
            echo 'This job verifies only immutable bytes, package identity, exports, dependency closure, and clean consumers.'
          } >> "$GITHUB_STEP_SUMMARY"

  publish-packages:
    needs: verify-candidates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: npm
    permissions:
      actions: read
      id-token: write
    outputs:
      vue-mode: ${{ steps.publish.outputs.vue_mode }}
      nuxt-mode: ${{ steps.publish.outputs.nuxt_mode }}
      mcp-mode: ${{ steps.publish.outputs.mcp_mode }}
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.11.0'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Download the verified Vue and Nuxt artifact set
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-candidate-vue-nuxt-set
          path: .release-artifacts
      - name: Download the verified MCP artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-candidate-mcp
          path: .release-artifacts
      - name: Publish and verify the complete certified package set
        id: publish
        env:
          BOOTSTRAP_PACKAGES: ${{ inputs.bootstrap_packages }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          node --input-type=module <<'NODE'
          import { spawnSync } from 'node:child_process'
          import { createHash } from 'node:crypto'
          import { appendFileSync, readFileSync, readdirSync } from 'node:fs'
          import { basename, dirname, join } from 'node:path'

          const fail = message => { throw new Error(message) }
          const expectedOrder = [
            ['vue', '@lupinum/better-convex-vue'],
            ['nuxt', '@lupinum/better-convex-nuxt'],
            ['mcp', '@lupinum/better-convex-mcp'],
          ]
          const allowed = new Set(expectedOrder.map(([, packageName]) => packageName))
          const requested = (process.env.BOOTSTRAP_PACKAGES ?? '')
            .split(',').map(value => value.trim()).filter(Boolean)
          if (new Set(requested).size !== requested.length || requested.some(name => !allowed.has(name))) {
            fail('bootstrap_packages must contain unique Better Convex package names.')
          }
          const authorized = new Set(requested)
          const files = []
          const walk = directory => {
            for (const entry of readdirSync(directory, { withFileTypes: true })) {
              const path = join(directory, entry.name)
              if (entry.isDirectory()) walk(path)
              else if (entry.isFile()) files.push(path)
            }
          }
          walk('.release-artifacts')
          const evidenceByPackage = new Map()
          for (const path of files.filter(path => basename(path) === 'artifact.json')) {
            const evidence = JSON.parse(readFileSync(path, 'utf8'))
            if (!allowed.has(evidence.packageName) || evidenceByPackage.has(evidence.packageName)) {
              fail('Artifact set contains an unknown or duplicate package.')
            }
            if (evidence.sourceCommit !== process.env.GITHUB_SHA) {
              fail(`${evidence.packageName} is not bound to the release source.`)
            }
            if (
              (evidence.packageName === '@lupinum/better-convex-vue' ||
                evidence.packageName === '@lupinum/better-convex-nuxt') &&
              evidence.version !== process.env.RELEASE_VERSION
            ) {
              fail(`${evidence.packageName} has the wrong release version.`)
            }
            const tarball = join(dirname(path), evidence.tarball?.file ?? '')
            if (basename(tarball) !== evidence.tarball?.file || !files.includes(tarball)) {
              fail(`${evidence.packageName} has invalid tarball evidence.`)
            }
            const bytes = readFileSync(tarball)
            const integrity = `sha512-${createHash('sha512').update(bytes).digest('base64')}`
            const sha256 = createHash('sha256').update(bytes).digest('hex')
            if (integrity !== evidence.tarball.integrity || sha256 !== evidence.tarball.sha256) {
              fail(`${evidence.packageName} tarball does not match its certified digest.`)
            }
            evidenceByPackage.set(evidence.packageName, {
              id: expectedOrder.find(([, name]) => name === evidence.packageName)?.[0],
              integrity,
              packageName: evidence.packageName,
              tarball,
              version: evidence.version,
            })
          }
          if (evidenceByPackage.size !== expectedOrder.length) {
            fail('Artifact set does not contain exactly three certified packages.')
          }

          const run = (args, inherit = false) => spawnSync('npm', args, {
            encoding: 'utf8',
            stdio: inherit ? 'inherit' : ['ignore', 'pipe', 'pipe'],
          })
          const view = (spec, field) => {
            const result = run(['view', spec, field, '--json'])
            if (result.status === 0) return JSON.parse(result.stdout.trim() || 'null')
            if (/E404|404 Not Found/u.test(result.stderr)) return null
            fail(`npm view failed for ${spec} ${field}: ${result.stderr.trim()}`)
          }
          const hasAttestations = value => Array.isArray(value)
            ? value.length > 0
            : Boolean(value && typeof value === 'object' && Object.keys(value).length > 0)
          const normalizeVersions = value => value == null ? [] : Array.isArray(value) ? value : [value]
          const modes = new Map()

          for (const [id, packageName] of expectedOrder) {
            const candidate = evidenceByPackage.get(packageName)
            if (!candidate || candidate.id !== id) fail(`Missing certified ${id} package.`)
            const spec = `${packageName}@${candidate.version}`
            const existing = view(spec, 'dist.integrity')
            if (existing && existing !== candidate.integrity) fail(`${spec} exists with different bytes.`)
            let mode
            if (existing) {
              const attestations = view(spec, 'dist.attestations')
              const versions = normalizeVersions(view(packageName, 'versions'))
              if (!hasAttestations(attestations) && (versions.length !== 1 || versions[0] !== candidate.version)) {
                fail(`${spec} is not the first package version and has no provenance.`)
              }
              if (!hasAttestations(attestations) && !authorized.has(packageName)) {
                fail(`${spec} requires explicit bootstrap authorization.`)
              }
              mode = hasAttestations(attestations) ? 'oidc' : 'bootstrap'
            } else {
              const result = run([
                'publish', candidate.tarball, '--access', 'public',
                '--tag', process.env.BCN_RELEASE_DIST_TAG,
                '--ignore-scripts', '--provenance',
              ], true)
              if (result.status !== 0) fail(`npm publish failed for ${spec}.`)
              mode = 'oidc'
            }
            for (let attempt = 0; attempt < 12; attempt += 1) {
              const registryIntegrity = view(spec, 'dist.integrity')
              const attestations = view(spec, 'dist.attestations')
              const channel = view(packageName, `dist-tags.${process.env.BCN_RELEASE_DIST_TAG}`)
              const versions = mode === 'bootstrap'
                ? normalizeVersions(view(packageName, 'versions'))
                : []
              const remainsFirstVersion = mode !== 'bootstrap' ||
                (versions.length === 1 && versions[0] === candidate.version)
              if (
                registryIntegrity === candidate.integrity &&
                channel === candidate.version &&
                remainsFirstVersion &&
                (mode === 'bootstrap' || hasAttestations(attestations))
              ) {
                modes.set(id, mode)
                appendFileSync(process.env.GITHUB_STEP_SUMMARY, `\n${packageName}: ${mode}.\n`)
                break
              }
              if (attempt === 11) {
                fail(`${spec} did not expose the required bytes, provenance mode, and ${process.env.BCN_RELEASE_DIST_TAG}.`)
              }
              Atomics.wait(new Int32Array(new SharedArrayBuffer(4)), 0, 0, 5000)
            }
          }
          for (const [id] of expectedOrder) {
            const mode = modes.get(id)
            if (!mode) fail(`Missing ${id} publication result.`)
            appendFileSync(process.env.GITHUB_OUTPUT, `${id}_mode=${mode}\n`)
          }
          NODE

  github-prerelease:
    needs: publish-packages
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Download the verified Vue and Nuxt artifact set
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-candidate-vue-nuxt-set
          path: .release-artifacts
      - name: Download the verified MCP artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-candidate-mcp
          path: .release-artifacts
      - name: Create or update the GitHub prerelease from the changelog
        env:
          GH_TOKEN: ${{ github.token }}
          VUE_MODE: ${{ needs.publish-packages.outputs.vue-mode }}
          NUXT_MODE: ${{ needs.publish-packages.outputs.nuxt-mode }}
          MCP_MODE: ${{ needs.publish-packages.outputs.mcp-mode }}
        run: |
          set -euo pipefail
          TAG="v${{ inputs.version }}"
          VERSION="${TAG#v}"
          EXPECTED_VERSION=$(node -e "const p = require('./package.json'); process.stdout.write(p.version)")
          test "$VERSION" = "$EXPECTED_VERSION"
          awk -v heading="## $TAG" '
            $0 == heading { capture = 1; next }
            capture && /^## / { exit }
            capture { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"
          test -s "$RUNNER_TEMP/release-notes.md"
          bootstrap_packages=()
          [ "$VUE_MODE" = bootstrap ] && bootstrap_packages+=("@lupinum/better-convex-vue")
          [ "$NUXT_MODE" = bootstrap ] && bootstrap_packages+=("@lupinum/better-convex-nuxt")
          [ "$MCP_MODE" = bootstrap ] && bootstrap_packages+=("@lupinum/better-convex-mcp")
          if [ "${#bootstrap_packages[@]}" -gt 0 ]; then
            cat >> "$RUNNER_TEMP/release-notes.md" <<'NOTICE'

          > [!NOTE]
          > This first npm version was created from the exact CI-certified artifact before npm trusted publishing could be configured. npm does not provide GitHub OIDC provenance for this bootstrap publication. The protected workflow verified the registry bytes. Later versions use trusted publishing with provenance.
          NOTICE
            bootstrap_list=$(IFS=,; echo "${bootstrap_packages[*]}")
            printf '> Bootstrap packages: %s\n' "$bootstrap_list" >> "$RUNNER_TEMP/release-notes.md"
          fi
          mapfile -t tarballs < <(find .release-artifacts -type f -name '*.tgz' | sort)
          test "${#tarballs[@]}" -eq 3
          vue_evidence=$(find .release-artifacts -path '*/vue/*/artifact.json' -type f -print -quit)
          nuxt_evidence=$(find .release-artifacts -path '*/nuxt/*/artifact.json' -type f -print -quit)
          mcp_evidence=".release-artifacts/artifact.json"
          set_evidence=$(find .release-artifacts -name 'artifact-set.json' -type f -print -quit)
          test -n "$vue_evidence"
          test -n "$nuxt_evidence"
          test -f "$mcp_evidence"
          test -n "$set_evidence"
          cp "$vue_evidence" "$RUNNER_TEMP/vue-artifact.json"
          cp "$nuxt_evidence" "$RUNNER_TEMP/nuxt-artifact.json"
          cp "$mcp_evidence" "$RUNNER_TEMP/mcp-artifact.json"
          cp "$set_evidence" "$RUNNER_TEMP/vue-nuxt-artifact-set.json"
          release_assets=(
            "${tarballs[@]}"
            "$RUNNER_TEMP/vue-artifact.json"
            "$RUNNER_TEMP/nuxt-artifact.json"
            "$RUNNER_TEMP/mcp-artifact.json"
            "$RUNNER_TEMP/vue-nuxt-artifact-set.json"
          )
          if gh release view "$TAG" >/dev/null 2>&1; then
            read -r tag_type tag_sha < <(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq '[.object.type, .object.sha] | @tsv')
            while [ "$tag_type" = tag ]; do
              read -r tag_type tag_sha < <(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_sha" --jq '[.object.type, .object.sha] | @tsv')
            done
            test "$tag_type" = commit
            test "$tag_sha" = "$GITHUB_SHA"
            gh release edit "$TAG" --title "Better Convex $TAG" --notes-file "$RUNNER_TEMP/release-notes.md" --prerelease
            gh release upload "$TAG" "${release_assets[@]}" --clobber
          else
            gh release create "$TAG" "${release_assets[@]}" --target "$GITHUB_SHA" --title "Better Convex $TAG" --notes-file "$RUNNER_TEMP/release-notes.md" --prerelease
          fi
