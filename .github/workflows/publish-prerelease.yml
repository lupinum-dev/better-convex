name: publish-prerelease

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact Nuxt and Vue prerelease version
        required: true
        type: string
      bootstrap_packages:
        description: Comma-separated packages explicitly authorized for first-version bootstrap recovery
        required: false
        default: ''
        type: string

concurrency:
  group: publish-better-convex
  cancel-in-progress: false

permissions:
  checks: read
  contents: read

env:
  BCN_RELEASE_DIST_TAG: next
  RELEASE_NODE_VERSION: '22.14.0'
  RELEASE_NPM_VERSION: '11.18.0'

jobs:
  preflight-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.RELEASE_NODE_VERSION }}
          package-manager-cache: false
      - name: Require current main and the exact prerelease version
        env:
          BOOTSTRAP_PACKAGES: ${{ inputs.bootstrap_packages }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          test "$GITHUB_REF" = refs/heads/main
          test "$(node -p "require('./package.json').version")" = "$RELEASE_VERSION"
          case "$RELEASE_VERSION" in *-*) ;; *) exit 1 ;; esac
          node -e "const allowed=new Set(['@lupinum/better-convex-vue','@lupinum/better-convex-nuxt','@lupinum/better-convex-mcp']); const requested=(process.env.BOOTSTRAP_PACKAGES||'').split(',').map(value=>value.trim()).filter(Boolean); if(new Set(requested).size!==requested.length||requested.some(name=>!allowed.has(name))) throw new Error('bootstrap_packages must contain unique Better Convex package names.')"
      - name: Require an unused release tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          status=$(curl --silent --show-error --output /dev/null --write-out "%{http_code}" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/git/ref/tags/v$RELEASE_VERSION")
          test "$status" = 404
      - run: npm install --global npm@"$RELEASE_NPM_VERSION" corepack@0.34.5 && corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Run the disposable lock and package smoke
        run: pnpm release:smoke

  source-certification:
    needs: preflight-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.RELEASE_NODE_VERSION }}
          package-manager-cache: false
      - name: Require the exact commit's authoritative hosted certification
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/assert-hosted-source-certification.mjs

  build-candidates:
    needs: staging-readiness
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.RELEASE_NODE_VERSION }}
          package-manager-cache: false

      - name: Install pinned release tooling
        run: npm install --global npm@"$RELEASE_NPM_VERSION" corepack@0.34.5 && corepack enable

      - name: Verify protected prerelease identity
        env:
          BCN_GOVERNANCE_MODE: solo-maintainer
          RELEASE_OWNER: ${{ github.actor }}
          RELEASE_TAG: v${{ inputs.version }}
        run: pnpm check:security-governance --prerelease

      - run: pnpm install --frozen-lockfile

      - name: Resolve the reviewed Vue/Nuxt candidate-set coordinates
        id: candidate_set
        run: node scripts/print-candidate-set-coordinates.mjs >> "$GITHUB_OUTPUT"

      - name: Build the immutable Vue/Nuxt candidate set once
        run: pnpm release:artifact:set

      - name: Upload the immutable Vue/Nuxt candidate set
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.candidate_set.outputs.artifact_name }}
          path: |
            ${{ steps.candidate_set.outputs.vue_directory }}/
            ${{ steps.candidate_set.outputs.nuxt_directory }}/
            ${{ steps.candidate_set.outputs.set_directory }}/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 90

      - name: Resolve the reviewed MCP artifact coordinates
        id: mcp
        run: node scripts/print-package-artifact-coordinates.mjs --package mcp >> "$GITHUB_OUTPUT"

      - name: Build the immutable MCP candidate once
        run: node scripts/release.mjs artifact --package mcp

      - name: Upload the immutable MCP candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.mcp.outputs.artifact_name }}
          path: ${{ steps.mcp.outputs.directory }}/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 90

  release-security:
    needs: source-certification
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan the release source for verified secrets
        uses: trufflesecurity/trufflehog@27b0417c16317ca9a472a9a8092acce143b49c55 # v3.95.9
        with:
          path: ./
          base: ''
          head: HEAD
          version: 3.95.9
          extra_args: --only-verified

      - name: Initialize release CodeQL analysis
        uses: github/codeql-action/init@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4
        with:
          languages: javascript-typescript

      - name: Analyze the exact release source
        uses: github/codeql-action/analyze@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4

  staging-readiness:
    needs: release-security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: bcn-auth-staging
    concurrency:
      group: bcn-auth-staging
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.RELEASE_NODE_VERSION }}
          package-manager-cache: false
      - run: npm install --global corepack@0.34.5 && corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Prove staging authority, ingress policy, and empty ownership without writes
        env:
          BCN_AUTH_STAGING_CONVEX_SITE_URL: ${{ vars.BCN_AUTH_STAGING_CONVEX_SITE_URL }}
          BCN_AUTH_STAGING_CONVEX_URL: ${{ vars.BCN_AUTH_STAGING_CONVEX_URL }}
          BCN_AUTH_STAGING_INGRESS_LEASE: ${{ secrets.BCN_AUTH_STAGING_INGRESS_LEASE }}
          BCN_AUTH_STAGING_ORIGIN: ${{ vars.BCN_AUTH_STAGING_ORIGIN }}
          BCN_AUTH_STAGING_TEAM: ${{ vars.BCN_AUTH_STAGING_TEAM }}
          CONVEX_DEPLOY_KEY: ${{ secrets.BCN_AUTH_STAGING_CONVEX_DEPLOY_KEY }}
        run: pnpm test:auth-cloud-staging --readiness-only

  verify-candidates:
    needs: build-candidates
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.RELEASE_NODE_VERSION }}
          package-manager-cache: false

      - name: Install pinned verification tooling
        run: npm install --global npm@"$RELEASE_NPM_VERSION" corepack@0.34.5 && corepack enable

      - run: pnpm install --frozen-lockfile
      - name: Resolve the reviewed candidate coordinates
        id: candidate_set
        run: node scripts/print-candidate-set-coordinates.mjs >> "$GITHUB_OUTPUT"

      - name: Resolve the reviewed MCP coordinates
        id: mcp
        run: node scripts/print-package-artifact-coordinates.mjs --package mcp >> "$GITHUB_OUTPUT"

      - name: Resolve the reviewed Vue coordinates
        id: vue
        run: node scripts/print-package-artifact-coordinates.mjs --package vue >> "$GITHUB_OUTPUT"

      - name: Resolve the reviewed Nuxt coordinates
        id: nuxt
        run: node scripts/print-package-artifact-coordinates.mjs --package nuxt >> "$GITHUB_OUTPUT"

      - name: Download the exact Vue/Nuxt candidate set
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ steps.candidate_set.outputs.artifact_name }}
          path: ${{ steps.candidate_set.outputs.directory }}

      - name: Download the exact MCP candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ steps.mcp.outputs.artifact_name }}
          path: ${{ steps.mcp.outputs.directory }}

      - name: Verify the exact Vue/Nuxt candidate set bytes
        run: pnpm release:verify:set "${{ steps.candidate_set.outputs.evidence }}"
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Certify the exact Vue candidate
        run: >-
          pnpm release:verify
          --package vue
          --artifact-manifest "${{ steps.vue.outputs.evidence }}"
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Certify the exact Nuxt candidate
        run: >-
          pnpm release:verify
          --package nuxt
          --artifact-manifest "${{ steps.nuxt.outputs.evidence }}"
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Verify the exact MCP candidate bytes
        run: >-
          pnpm release:verify
          --package mcp
          --artifact-manifest "${{ steps.mcp.outputs.evidence }}"
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Record the artifact-only verification boundary
        run: |
          {
            echo '## Exact artifact verification'
            echo
            echo 'Full source certification completed once before minting.'
            echo 'This job verifies only immutable bytes, package identity, exports, dependency closure, and clean consumers.'
          } >> "$GITHUB_STEP_SUMMARY"

  bcn-auth-staging:
    needs: verify-candidates
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: bcn-auth-staging
    concurrency:
      group: bcn-auth-staging
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.RELEASE_NODE_VERSION }}
          package-manager-cache: false

      - name: Install pinned cloud-gate tooling
        run: npm install --global npm@"$RELEASE_NPM_VERSION" corepack@0.34.5 vercel@58.9.1 && corepack enable

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium

      - name: Resolve the reviewed candidate coordinates
        id: candidate_set
        run: node scripts/print-candidate-set-coordinates.mjs >> "$GITHUB_OUTPUT"

      - name: Resolve the reviewed Nuxt artifact coordinates
        id: nuxt
        run: node scripts/print-package-artifact-coordinates.mjs --package nuxt >> "$GITHUB_OUTPUT"

      - name: Resolve the reviewed Vue artifact coordinates
        id: vue
        run: node scripts/print-package-artifact-coordinates.mjs --package vue >> "$GITHUB_OUTPUT"

      - name: Resolve the reviewed MCP artifact coordinates
        id: mcp
        run: node scripts/print-package-artifact-coordinates.mjs --package mcp >> "$GITHUB_OUTPUT"

      - name: Download the exact verified Vue/Nuxt candidate set
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ steps.candidate_set.outputs.artifact_name }}
          path: ${{ steps.candidate_set.outputs.directory }}

      - name: Download the exact verified MCP candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ steps.mcp.outputs.artifact_name }}
          path: ${{ steps.mcp.outputs.directory }}

      - name: Deploy the exact Nuxt artifact to the dedicated staging host
        env:
          BCN_AUTH_STAGING_CONVEX_SITE_URL: ${{ vars.BCN_AUTH_STAGING_CONVEX_SITE_URL }}
          BCN_AUTH_STAGING_CONVEX_URL: ${{ vars.BCN_AUTH_STAGING_CONVEX_URL }}
          BCN_AUTH_STAGING_INGRESS_LEASE: ${{ secrets.BCN_AUTH_STAGING_INGRESS_LEASE }}
          BCN_AUTH_STAGING_ORIGIN: ${{ vars.BCN_AUTH_STAGING_ORIGIN }}
          BCN_AUTH_STAGING_TEAM: ${{ vars.BCN_AUTH_STAGING_TEAM }}
          BCN_AUTH_STAGING_VERCEL_ORG_ID: ${{ vars.BCN_AUTH_STAGING_VERCEL_ORG_ID }}
          BCN_AUTH_STAGING_VERCEL_PROJECT_ID: ${{ vars.BCN_AUTH_STAGING_VERCEL_PROJECT_ID }}
          BCN_AUTH_STAGING_VERCEL_TOKEN: ${{ secrets.BCN_AUTH_STAGING_VERCEL_TOKEN }}
          CONVEX_DEPLOY_KEY: ${{ secrets.BCN_AUTH_STAGING_CONVEX_DEPLOY_KEY }}
        run: >-
          node scripts/deploy-auth-staging-host.mjs
          --artifact-manifest "${{ steps.nuxt.outputs.evidence }}"
          --vue-artifact-manifest "${{ steps.vue.outputs.evidence }}"
          --mcp-artifact-manifest "${{ steps.mcp.outputs.evidence }}"

      - name: Run protected cloud-staging races against the exact deployment
        env:
          BCN_AUTH_STAGING_CONVEX_SITE_URL: ${{ vars.BCN_AUTH_STAGING_CONVEX_SITE_URL }}
          BCN_AUTH_STAGING_CONVEX_URL: ${{ vars.BCN_AUTH_STAGING_CONVEX_URL }}
          BCN_AUTH_STAGING_EMAIL: ${{ secrets.BCN_AUTH_STAGING_EMAIL }}
          BCN_AUTH_STAGING_INGRESS_LEASE: ${{ secrets.BCN_AUTH_STAGING_INGRESS_LEASE }}
          BCN_AUTH_STAGING_ORIGIN: ${{ vars.BCN_AUTH_STAGING_ORIGIN }}
          BCN_AUTH_STAGING_PASSWORD: ${{ secrets.BCN_AUTH_STAGING_PASSWORD }}
          BCN_AUTH_STAGING_TEAM: ${{ vars.BCN_AUTH_STAGING_TEAM }}
          CONVEX_DEPLOY_KEY: ${{ secrets.BCN_AUTH_STAGING_CONVEX_DEPLOY_KEY }}
        run: >-
          pnpm test:auth-cloud-staging
          --artifact-manifest "${{ steps.nuxt.outputs.evidence }}"
          --vue-artifact-manifest "${{ steps.vue.outputs.evidence }}"
          --mcp-artifact-manifest "${{ steps.mcp.outputs.evidence }}"

      - name: Upload the separate non-secret cloud report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bcn-auth-staging-report
          path: .release-artifacts/bcn-auth-staging.report.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 90

  publish-vue:
    needs: bcn-auth-staging
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm
    permissions:
      actions: read
      id-token: write
    outputs:
      mode: ${{ steps.publish.outputs.mode }}
      package: ${{ steps.publish.outputs.package }}
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.11.0'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-candidate-vue-nuxt-set
          path: .release-artifacts
      - name: Publish the certified Vue tarball
        id: publish
        env:
          BOOTSTRAP_PACKAGES: ${{ inputs.bootstrap_packages }}
        run: |
          set -euo pipefail
          mapfile -t TARBALLS < <(find .release-artifacts -type f -name 'lupinum-better-convex-vue-*.tgz' -print)
          test "${#TARBALLS[@]}" -eq 1
          TARBALL="${TARBALLS[0]}"
          tar -xOf "$TARBALL" package/package.json > "$RUNNER_TEMP/package.json"
          PACKAGE=$(node -e "const p = require(process.argv[1]); process.stdout.write(p.name)" "$RUNNER_TEMP/package.json")
          VERSION=$(node -e "const p = require(process.argv[1]); process.stdout.write(p.version)" "$RUNNER_TEMP/package.json")
          LOCAL_INTEGRITY="sha512-$(openssl dgst -sha512 -binary "$TARBALL" | openssl base64 -A)"
          test "$PACKAGE" = '@lupinum/better-convex-vue'
          export TARBALL PACKAGE VERSION LOCAL_INTEGRITY
          node --input-type=module <<'NODE'
          import { spawnSync } from 'node:child_process'
          import { appendFileSync } from 'node:fs'
          const fail = message => { throw new Error(message) }
          const run = (args, inherit = false) => spawnSync('npm', args, {
            encoding: 'utf8',
            stdio: inherit ? 'inherit' : ['ignore', 'pipe', 'pipe'],
          })
          const view = (spec, field) => {
            const result = run(['view', spec, field, '--json'])
            if (result.status === 0) return JSON.parse(result.stdout.trim() || 'null')
            if (/E404|404 Not Found/.test(result.stderr)) return null
            fail(`npm view failed for ${spec} ${field}: ${result.stderr.trim()}`)
          }
          const { PACKAGE: packageName, VERSION: version, LOCAL_INTEGRITY: integrity } = process.env
          const spec = `${packageName}@${version}`
          const existing = view(spec, 'dist.integrity')
          if (existing && existing !== integrity) fail(`${spec} exists with different bytes.`)
          let mode
          if (existing) {
            const attestations = view(spec, 'dist.attestations')
            const published = view(packageName, 'versions')
            const versions = Array.isArray(published) ? published : [published]
            if (!attestations && (versions.length !== 1 || versions[0] !== version)) {
              fail(`${spec} is not the first package version and has no provenance.`)
            }
            const authorized = new Set((process.env.BOOTSTRAP_PACKAGES ?? '').split(',').map(value => value.trim()).filter(Boolean))
            if (!attestations && !authorized.has(packageName)) {
              fail(`${spec} requires explicit bootstrap authorization.`)
            }
            mode = attestations ? 'oidc' : 'bootstrap'
          } else {
            const result = run([
              'publish', process.env.TARBALL, '--tag', process.env.BCN_RELEASE_DIST_TAG,
              '--access', 'public', '--ignore-scripts', '--provenance',
            ], true)
            if (result.status !== 0) fail(`npm publish failed for ${spec}.`)
            mode = 'oidc'
          }
          for (let attempt = 0; attempt < 12; attempt += 1) {
            const registryIntegrity = view(spec, 'dist.integrity')
            const attestations = view(spec, 'dist.attestations')
            const channel = view(packageName, `dist-tags.${process.env.BCN_RELEASE_DIST_TAG}`)
            const published = mode === 'bootstrap' ? view(packageName, 'versions') : null
            const versions = Array.isArray(published) ? published : [published]
            const remainsFirstVersion = mode !== 'bootstrap' || (versions.length === 1 && versions[0] === version)
            if (
              registryIntegrity === integrity && channel === version && remainsFirstVersion &&
              (mode === 'bootstrap' || (mode === 'oidc' && attestations))
            ) {
              appendFileSync(process.env.GITHUB_OUTPUT, `mode=${mode}\n`)
              appendFileSync(process.env.GITHUB_OUTPUT, `package=${packageName}\n`)
              appendFileSync(process.env.GITHUB_STEP_SUMMARY, `\n${packageName}: ${mode}.\n`)
              process.exit(0)
            }
            Atomics.wait(new Int32Array(new SharedArrayBuffer(4)), 0, 0, 5000)
          }
          fail(`${spec} did not expose the required bytes, provenance mode, and ${process.env.BCN_RELEASE_DIST_TAG}.`)
          NODE

  registry-vue-nuxt-gate:
    needs: publish-vue
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.RELEASE_NODE_VERSION }}
          package-manager-cache: false
      - run: npm install --global npm@"$RELEASE_NPM_VERSION" corepack@0.34.5 && corepack enable
      - run: pnpm install --frozen-lockfile
      - id: candidate_set
        run: node scripts/print-candidate-set-coordinates.mjs >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ steps.candidate_set.outputs.artifact_name }}
          path: ${{ steps.candidate_set.outputs.directory }}
      - name: Install unchanged Nuxt with registry Vue and compare both installed packages
        run: >-
          node scripts/check-nuxt-registry-vue-consumer.mjs
          --artifact-set "${{ steps.candidate_set.outputs.evidence }}"

  publish-nuxt:
    needs: registry-vue-nuxt-gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm
    permissions:
      actions: read
      id-token: write
    outputs:
      mode: ${{ steps.publish.outputs.mode }}
      package: ${{ steps.publish.outputs.package }}
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.11.0'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-candidate-vue-nuxt-set
          path: .release-artifacts
      - name: Publish the certified Nuxt tarball
        id: publish
        env:
          BOOTSTRAP_PACKAGES: ${{ inputs.bootstrap_packages }}
        run: |
          set -euo pipefail
          mapfile -t TARBALLS < <(find .release-artifacts -type f -name 'lupinum-better-convex-nuxt-*.tgz' -print)
          test "${#TARBALLS[@]}" -eq 1
          TARBALL="${TARBALLS[0]}"
          tar -xOf "$TARBALL" package/package.json > "$RUNNER_TEMP/package.json"
          PACKAGE=$(node -e "const p = require(process.argv[1]); process.stdout.write(p.name)" "$RUNNER_TEMP/package.json")
          VERSION=$(node -e "const p = require(process.argv[1]); process.stdout.write(p.version)" "$RUNNER_TEMP/package.json")
          LOCAL_INTEGRITY="sha512-$(openssl dgst -sha512 -binary "$TARBALL" | openssl base64 -A)"
          test "$PACKAGE" = '@lupinum/better-convex-nuxt'
          export TARBALL PACKAGE VERSION LOCAL_INTEGRITY
          node --input-type=module <<'NODE'
          import { spawnSync } from 'node:child_process'
          import { appendFileSync } from 'node:fs'
          const fail = message => { throw new Error(message) }
          const run = (args, inherit = false) => spawnSync('npm', args, {
            encoding: 'utf8',
            stdio: inherit ? 'inherit' : ['ignore', 'pipe', 'pipe'],
          })
          const view = (spec, field) => {
            const result = run(['view', spec, field, '--json'])
            if (result.status === 0) return JSON.parse(result.stdout.trim() || 'null')
            if (/E404|404 Not Found/.test(result.stderr)) return null
            fail(`npm view failed for ${spec} ${field}: ${result.stderr.trim()}`)
          }
          const { PACKAGE: packageName, VERSION: version, LOCAL_INTEGRITY: integrity } = process.env
          const spec = `${packageName}@${version}`
          const existing = view(spec, 'dist.integrity')
          if (existing && existing !== integrity) fail(`${spec} exists with different bytes.`)
          let mode
          if (existing) {
            const attestations = view(spec, 'dist.attestations')
            const published = view(packageName, 'versions')
            const versions = Array.isArray(published) ? published : [published]
            if (!attestations && (versions.length !== 1 || versions[0] !== version)) {
              fail(`${spec} is not the first package version and has no provenance.`)
            }
            const authorized = new Set((process.env.BOOTSTRAP_PACKAGES ?? '').split(',').map(value => value.trim()).filter(Boolean))
            if (!attestations && !authorized.has(packageName)) {
              fail(`${spec} requires explicit bootstrap authorization.`)
            }
            mode = attestations ? 'oidc' : 'bootstrap'
          } else {
            const result = run([
              'publish', process.env.TARBALL, '--tag', process.env.BCN_RELEASE_DIST_TAG,
              '--access', 'public', '--ignore-scripts', '--provenance',
            ], true)
            if (result.status !== 0) fail(`npm publish failed for ${spec}.`)
            mode = 'oidc'
          }
          for (let attempt = 0; attempt < 12; attempt += 1) {
            const registryIntegrity = view(spec, 'dist.integrity')
            const attestations = view(spec, 'dist.attestations')
            const channel = view(packageName, `dist-tags.${process.env.BCN_RELEASE_DIST_TAG}`)
            const published = mode === 'bootstrap' ? view(packageName, 'versions') : null
            const versions = Array.isArray(published) ? published : [published]
            const remainsFirstVersion = mode !== 'bootstrap' || (versions.length === 1 && versions[0] === version)
            if (
              registryIntegrity === integrity && channel === version && remainsFirstVersion &&
              (mode === 'bootstrap' || (mode === 'oidc' && attestations))
            ) {
              appendFileSync(process.env.GITHUB_OUTPUT, `mode=${mode}\n`)
              appendFileSync(process.env.GITHUB_OUTPUT, `package=${packageName}\n`)
              appendFileSync(process.env.GITHUB_STEP_SUMMARY, `\n${packageName}: ${mode}.\n`)
              process.exit(0)
            }
            Atomics.wait(new Int32Array(new SharedArrayBuffer(4)), 0, 0, 5000)
          }
          fail(`${spec} did not expose the required bytes, provenance mode, and ${process.env.BCN_RELEASE_DIST_TAG}.`)
          NODE

  registry-nuxt-gate:
    needs: publish-nuxt
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.RELEASE_NODE_VERSION }}
          package-manager-cache: false
      - run: npm install --global npm@"$RELEASE_NPM_VERSION" corepack@0.34.5 && corepack enable
      - run: pnpm install --frozen-lockfile
      - id: candidate_set
        run: node scripts/print-candidate-set-coordinates.mjs >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ steps.candidate_set.outputs.artifact_name }}
          path: ${{ steps.candidate_set.outputs.directory }}
      - name: Compare Nuxt registry bytes with the approved candidate
        run: node scripts/compare-registry-package.mjs --package nuxt

  publish-mcp:
    needs: registry-nuxt-gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm
    permissions:
      actions: read
      id-token: write
    outputs:
      mode: ${{ steps.publish.outputs.mode }}
      package: ${{ steps.publish.outputs.package }}
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.11.0'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-candidate-mcp
          path: .release-artifacts
      - name: Publish the certified MCP tarball
        id: publish
        env:
          BOOTSTRAP_PACKAGES: ${{ inputs.bootstrap_packages }}
        run: |
          set -euo pipefail
          mapfile -t TARBALLS < <(find .release-artifacts -type f -name 'lupinum-better-convex-mcp-*.tgz' -print)
          test "${#TARBALLS[@]}" -eq 1
          TARBALL="${TARBALLS[0]}"
          tar -xOf "$TARBALL" package/package.json > "$RUNNER_TEMP/package.json"
          PACKAGE=$(node -e "const p = require(process.argv[1]); process.stdout.write(p.name)" "$RUNNER_TEMP/package.json")
          VERSION=$(node -e "const p = require(process.argv[1]); process.stdout.write(p.version)" "$RUNNER_TEMP/package.json")
          LOCAL_INTEGRITY="sha512-$(openssl dgst -sha512 -binary "$TARBALL" | openssl base64 -A)"
          test "$PACKAGE" = '@lupinum/better-convex-mcp'
          export TARBALL PACKAGE VERSION LOCAL_INTEGRITY
          node --input-type=module <<'NODE'
          import { spawnSync } from 'node:child_process'
          import { appendFileSync } from 'node:fs'
          const fail = message => { throw new Error(message) }
          const run = (args, inherit = false) => spawnSync('npm', args, {
            encoding: 'utf8',
            stdio: inherit ? 'inherit' : ['ignore', 'pipe', 'pipe'],
          })
          const view = (spec, field) => {
            const result = run(['view', spec, field, '--json'])
            if (result.status === 0) return JSON.parse(result.stdout.trim() || 'null')
            if (/E404|404 Not Found/.test(result.stderr)) return null
            fail(`npm view failed for ${spec} ${field}: ${result.stderr.trim()}`)
          }
          const { PACKAGE: packageName, VERSION: version, LOCAL_INTEGRITY: integrity } = process.env
          const spec = `${packageName}@${version}`
          const existing = view(spec, 'dist.integrity')
          if (existing && existing !== integrity) fail(`${spec} exists with different bytes.`)
          let mode
          if (existing) {
            const attestations = view(spec, 'dist.attestations')
            const published = view(packageName, 'versions')
            const versions = Array.isArray(published) ? published : [published]
            if (!attestations && (versions.length !== 1 || versions[0] !== version)) {
              fail(`${spec} is not the first package version and has no provenance.`)
            }
            const authorized = new Set((process.env.BOOTSTRAP_PACKAGES ?? '').split(',').map(value => value.trim()).filter(Boolean))
            if (!attestations && !authorized.has(packageName)) {
              fail(`${spec} requires explicit bootstrap authorization.`)
            }
            mode = attestations ? 'oidc' : 'bootstrap'
          } else {
            const result = run([
              'publish', process.env.TARBALL, '--tag', process.env.BCN_RELEASE_DIST_TAG,
              '--access', 'public', '--ignore-scripts', '--provenance',
            ], true)
            if (result.status !== 0) fail(`npm publish failed for ${spec}.`)
            mode = 'oidc'
          }
          for (let attempt = 0; attempt < 12; attempt += 1) {
            const registryIntegrity = view(spec, 'dist.integrity')
            const attestations = view(spec, 'dist.attestations')
            const channel = view(packageName, `dist-tags.${process.env.BCN_RELEASE_DIST_TAG}`)
            const published = mode === 'bootstrap' ? view(packageName, 'versions') : null
            const versions = Array.isArray(published) ? published : [published]
            const remainsFirstVersion = mode !== 'bootstrap' || (versions.length === 1 && versions[0] === version)
            if (
              registryIntegrity === integrity && channel === version && remainsFirstVersion &&
              (mode === 'bootstrap' || (mode === 'oidc' && attestations))
            ) {
              appendFileSync(process.env.GITHUB_OUTPUT, `mode=${mode}\n`)
              appendFileSync(process.env.GITHUB_OUTPUT, `package=${packageName}\n`)
              appendFileSync(process.env.GITHUB_STEP_SUMMARY, `\n${packageName}: ${mode}.\n`)
              process.exit(0)
            }
            Atomics.wait(new Int32Array(new SharedArrayBuffer(4)), 0, 0, 5000)
          }
          fail(`${spec} did not expose the required bytes, provenance mode, and ${process.env.BCN_RELEASE_DIST_TAG}.`)
          NODE

  registry-mcp-gate:
    needs: publish-mcp
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.RELEASE_NODE_VERSION }}
          package-manager-cache: false
      - run: npm install --global npm@"$RELEASE_NPM_VERSION" corepack@0.34.5 && corepack enable
      - run: pnpm install --frozen-lockfile
      - id: mcp
        run: node scripts/print-package-artifact-coordinates.mjs --package mcp >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ steps.mcp.outputs.artifact_name }}
          path: ${{ steps.mcp.outputs.directory }}
      - name: Compare MCP registry bytes with the approved candidate
        run: node scripts/compare-registry-package.mjs --package mcp

  published-package-set-complete:
    needs:
      - publish-vue
      - registry-vue-nuxt-gate
      - publish-nuxt
      - registry-nuxt-gate
      - publish-mcp
      - registry-mcp-gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      vue-mode: ${{ needs.publish-vue.outputs.mode }}
      nuxt-mode: ${{ needs.publish-nuxt.outputs.mode }}
      mcp-mode: ${{ needs.publish-mcp.outputs.mode }}
      vue-package: ${{ needs.publish-vue.outputs.package }}
      nuxt-package: ${{ needs.publish-nuxt.outputs.package }}
      mcp-package: ${{ needs.publish-mcp.outputs.package }}
    steps:
      - name: Record the verified package set
        env:
          VUE_MODE: ${{ needs.publish-vue.outputs.mode }}
          NUXT_MODE: ${{ needs.publish-nuxt.outputs.mode }}
          MCP_MODE: ${{ needs.publish-mcp.outputs.mode }}
        run: >-
          echo "All registry bytes match under ${BCN_RELEASE_DIST_TAG}.
          Publication modes: Vue=${VUE_MODE}, Nuxt=${NUXT_MODE}, MCP=${MCP_MODE}."

  github-prerelease:
    needs: published-package-set-complete
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Create or update the GitHub prerelease from the changelog
        env:
          GH_TOKEN: ${{ github.token }}
          VUE_MODE: ${{ needs.published-package-set-complete.outputs.vue-mode }}
          NUXT_MODE: ${{ needs.published-package-set-complete.outputs.nuxt-mode }}
          MCP_MODE: ${{ needs.published-package-set-complete.outputs.mcp-mode }}
          VUE_PACKAGE: ${{ needs.published-package-set-complete.outputs.vue-package }}
          NUXT_PACKAGE: ${{ needs.published-package-set-complete.outputs.nuxt-package }}
          MCP_PACKAGE: ${{ needs.published-package-set-complete.outputs.mcp-package }}
        run: |
          set -euo pipefail
          TAG="v${{ inputs.version }}"
          VERSION="${TAG#v}"
          EXPECTED_VERSION=$(node -e "const p = require('./package.json'); process.stdout.write(p.version)")
          test "$VERSION" = "$EXPECTED_VERSION"
          awk -v heading="## $TAG" '
            $0 == heading { capture = 1; next }
            capture && /^## / { exit }
            capture { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"
          test -s "$RUNNER_TEMP/release-notes.md"
          bootstrap_packages=()
          [ "$VUE_MODE" = bootstrap ] && bootstrap_packages+=("$VUE_PACKAGE")
          [ "$NUXT_MODE" = bootstrap ] && bootstrap_packages+=("$NUXT_PACKAGE")
          [ "$MCP_MODE" = bootstrap ] && bootstrap_packages+=("$MCP_PACKAGE")
          if [ "${#bootstrap_packages[@]}" -gt 0 ]; then
            cat >> "$RUNNER_TEMP/release-notes.md" <<'NOTICE'

          > [!NOTE]
          > This first npm version was created from the exact CI-certified artifact before npm trusted publishing could be configured. npm does not provide GitHub OIDC provenance for this bootstrap publication. The protected workflow verified the registry bytes. Later versions use trusted publishing with provenance.
          NOTICE
            bootstrap_list=$(IFS=,; echo "${bootstrap_packages[*]}")
            printf '> Bootstrap packages: %s\n' "$bootstrap_list" >> "$RUNNER_TEMP/release-notes.md"
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            read -r tag_type tag_sha < <(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq '[.object.type, .object.sha] | @tsv')
            while [ "$tag_type" = tag ]; do
              read -r tag_type tag_sha < <(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_sha" --jq '[.object.type, .object.sha] | @tsv')
            done
            test "$tag_type" = commit
            test "$tag_sha" = "$GITHUB_SHA"
            gh release edit "$TAG" --title "Better Convex $TAG" --notes-file "$RUNNER_TEMP/release-notes.md" --prerelease
          else
            gh release create "$TAG" --target "$GITHUB_SHA" --title "Better Convex $TAG" --notes-file "$RUNNER_TEMP/release-notes.md" --prerelease
          fi
