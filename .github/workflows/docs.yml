name: docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/docs.yml'
  pull_request:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/docs.yml'
  schedule:
    - cron: '43 4 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.14.0'
          package-manager-cache: false
      - name: Install docs dependencies without lifecycle scripts
        working-directory: docs
        run: corepack pnpm@10.23.0 install --frozen-lockfile --ignore-scripts
      - name: Audit the deployable docs dependency graph
        working-directory: docs
        run: corepack pnpm@10.23.0 audit --prod
      - name: Type-check docs
        working-directory: docs
        run: corepack pnpm@10.23.0 typecheck
      - name: Build docs
        working-directory: docs
        run: corepack pnpm@10.23.0 build

  link-check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Check external links in docs content
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          args: >-
            --no-progress
            --include-mail=false
            --accept 100..=103,200..=299,403
            docs/content
          fail: true
