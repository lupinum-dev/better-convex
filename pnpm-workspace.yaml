packages:
  # The Nuxt module is the root package. Listing it lets Changesets version it
  # together with the Vue package (see DECISIONS.md).
  - '.'
  - playground
  - packages/*

# Dependency quarantine: never install versions younger than 24 hours.
minimumReleaseAge: 1440
minimumReleaseAgeStrict: true
minimumReleaseAgeIgnoreMissingTime: false

linkWorkspacePackages: true
shamefullyHoist: true
strictPeerDependencies: true

overrides:
  # Express 4 and body-parser 1 constrain qs below the patched minor.
  # Remove when both owners accept qs >=6.16.0 and the audit stays clean.
  'express@4>qs': 6.16.0
  'body-parser@1>qs': 6.16.0
  # Transitive build and HTTP owners permit these patched releases, but can
  # retain vulnerable lockfile selections. Remove when a clean resolution
  # selects svgo >=4.1.0 and hono >=4.13.5 without overrides.
  svgo: 4.1.0
  hono: 4.13.7

# Only these dependencies may run install scripts.
allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  unrs-resolver: true

auditConfig:
  # No patched release exists for these two advisories (first_patched_version is
  # null). Both reach this lockfile only through Nuxt development tooling:
  # braces through nitropack > globby (build-time globbing of repository files)
  # and node-forge through listhen (self-signed dev-server certificates). Neither
  # is in a published package or handles untrusted input. Remove each entry as
  # soon as a patched release passes the 24-hour quarantine.
  ignoreGhsas:
    - GHSA-vfj7-8cjw-p6xm # braces <=3.0.3
    - GHSA-86w9-cpqp-85rv # node-forge <=1.4.0
