packages:
  # The Nuxt module is the root package. Listing it lets Changesets version it
  # together with the Vue package (see internals/decisions.md).
  - '.'
  - playground
  - packages/*

# Dependency quarantine: never install versions younger than 24 hours.
minimumReleaseAge: 1440
minimumReleaseAgeStrict: true
minimumReleaseAgeIgnoreMissingTime: false

linkWorkspacePackages: true
shamefullyHoist: true
strictPeerDependencies: true

overrides:
  # Several compiler/build owners pin the vulnerable patch exactly.
  # Remove when clean resolution selects source-map-js >=1.2.2 without this pin.
  source-map-js: 1.2.2
  # oxfmt 0.59 pins the vulnerable worker pool exactly.
  # Remove when oxfmt requires tinypool >=2.1.2.
  'oxfmt>tinypool': 2.1.2
  # Transitive build and HTTP owners permit these patched releases, but can
  # retain vulnerable lockfile selections. Remove when a clean resolution
  # selects svgo >=4.1.0 and hono >=4.13.5 without overrides.
  svgo: 4.1.0
  hono: 4.13.11

# Only these dependencies may run install scripts.
allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  unrs-resolver: true

auditConfig:
  # No patched release exists for this advisory (first_patched_version is null).
  # braces reaches this lockfile only through Nuxt development tooling (nitropack >
  # globby, build-time globbing of repository files). It is in no published package
  # and handles no untrusted input. Remove it once a patched release passes the
  # 24-hour quarantine.
  ignoreGhsas:
    - GHSA-vfj7-8cjw-p6xm # braces <=3.0.3
