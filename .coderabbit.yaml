# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: en-US
early_access: false

reviews:
  profile: assertive
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  path_filters:
    - '!reports/**'
    - '!test-results/**'
    - '!**/fixtures/baselines/**'
    - '!**/*.pdf'
    - '!**/*.png'
    - '!**/*.woff'
    - '!**/*.woff2'
  path_instructions:
    - path: '.github/workflows/**'
      instructions: |
        Review permission boundaries, untrusted shell input, and immutable action pins. The publish job must stay in the protected `npm` environment, use OIDC, and neither check out nor install anything. A job that can start workflows must not install dependencies.
    - path: '**/*.md'
      instructions: |
        Follow docs/WRITING.md and its explicit exemptions. Use short sentences and American English. Do not rewrite code, API names, legal text, quotations, or changelog history.
    - path: '**/*.test.*'
      instructions: |
        Prefer invariant and failure tests. Check that the test fails before the fix and proves the public contract.
    - path: '**/*.spec.*'
      instructions: |
        Prefer invariant and failure tests. Check that the test fails before the fix and proves the public contract.
  auto_review:
    enabled: true
    drafts: false
    auto_incremental_review: true
    auto_pause_after_reviewed_commits: 5
    ignore_usernames:
      - renovate[bot]
      - github-actions[bot]

chat:
  auto_reply: true
