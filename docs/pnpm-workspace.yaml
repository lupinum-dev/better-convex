packages:
  - .

minimumReleaseAge: 1440
minimumReleaseAgeStrict: true
minimumReleaseAgeIgnoreMissingTime: false

allowBuilds:
  '@parcel/watcher': true
  better-sqlite3: true
  esbuild: true
  unrs-resolver: true
  vue-demi: true

overrides:
  # Express retains a vulnerable proxy-addr selection after targeted updates.
  # Remove when clean resolution selects proxy-addr >=2.0.8 without this pin.
  proxy-addr: 2.0.8
  # Several compiler/build owners pin the vulnerable patch exactly.
  # Remove when clean resolution selects source-map-js >=1.2.2 without this pin.
  source-map-js: 1.2.2
  # Remove these audit pins when normal resolution retains the patched versions.
  'ajv@8>fast-uri': 3.1.7
  'express@5>qs': 6.16.0
  'body-parser@2>qs': 6.16.0
  esbuild: 0.28.1
  sharp: 0.35.5
  hono: 4.13.7

auditConfig:
  # No patched release exists for these two advisories (first_patched_version is
  # null). Both reach this lockfile only through Nuxt development tooling:
  # braces through nitropack > globby (build-time globbing of repository files)
  # and node-forge through listhen (self-signed dev-server certificates). Neither
  # is in a published package or handles untrusted input. Remove each entry as
  # soon as a patched release passes the 24-hour quarantine.
  ignoreGhsas:
    - GHSA-vfj7-8cjw-p6xm # braces <=3.0.3
    - GHSA-86w9-cpqp-85rv # node-forge <=1.4.0
    # simple-git reaches these lockfiles only through @nuxt/devtools, which runs
    # git on the developer's own checkout and passes no untrusted arguments. All
    # four advisories bypass simple-git's unsafe-operation guard and need
    # attacker-controlled arguments. The only fix is simple-git 4, which
    # @nuxt/devtools 3.4.1 cannot load (it imports the removed default export).
    # Remove these when a stable @nuxt/devtools depends on simple-git >=4.0.1.
    - GHSA-x6jw-m9v5-85vh # simple-git >=3.15.0 <4.0.1
    - GHSA-858h-whjf-mvg5 # simple-git <=3.36.0
    - GHSA-g4wm-2vf7-vfgr # simple-git <=3.36.0
    - GHSA-v5rq-49vh-5v5c # @simple-git/argv-parser <2.0.1
