packages:
  - .

minimumReleaseAge: 1440
minimumReleaseAgeStrict: true
minimumReleaseAgeIgnoreMissingTime: false

allowBuilds:
  '@parcel/watcher': true
  better-sqlite3: true
  esbuild: true
  unrs-resolver: true
  vue-demi: true

overrides:
  # Express retains a vulnerable proxy-addr selection after targeted updates.
  # Remove when clean resolution selects proxy-addr >=2.0.8 without this pin.
  proxy-addr: 2.0.8
  # Several compiler/build owners pin the vulnerable patch exactly.
  # Remove when clean resolution selects source-map-js >=1.2.2 without this pin.
  source-map-js: 1.2.2
  # @lupinum/ginko-content 1.0.0-beta.5 and @lupinum/ginko-docs 0.4.0-rc.4 pin
  # zod 4.4.3 exactly (GHSA-mrhx-c7xc-m3w5, fixed in 4.6.6). Remove when the docs
  # use ginko releases that allow zod >=4.6.6 without this pin.
  zod: 4.6.7
  # Remove these audit pins when normal resolution retains the patched versions.
  'ajv@8>fast-uri': 3.1.9
  'express@5>qs': 6.16.1
  'body-parser@2>qs': 6.16.1
  esbuild: 0.28.1
  sharp: 0.35.5
  hono: 4.13.17
  ip-address: 10.7.4

auditConfig:
  # No patched release exists for this advisory (first_patched_version is null).
  # braces reaches this lockfile only through Nuxt development tooling (nitropack >
  # globby, build-time globbing of repository files). It is in no published package
  # and handles no untrusted input. Remove it once a patched release passes the
  # 24-hour quarantine.
  ignoreGhsas:
    - GHSA-vfj7-8cjw-p6xm # braces <=3.0.3

patchedDependencies:
  # The agent markdown index (llms.txt, llms-full.txt, /raw/ pages) reads the docs
  # collection with one many() call, which returns at most 100 rows. With more pages a
  # random few go missing on each build. The patch pages through the collection. Remove it
  # when ginko-content pages queryMarkdownEnabledContent (still unpaged in 1.0.0-beta.10).
  '@lupinum/ginko-content@1.0.0-beta.5': patches/@lupinum__ginko-content@1.0.0-beta.5.patch
