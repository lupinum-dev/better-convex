packages:
  - .

minimumReleaseAge: 1440
minimumReleaseAgeStrict: true
minimumReleaseAgeIgnoreMissingTime: false

# Exact first-party prerelease certified in lupinum-dev/ginko-docs Actions run
# 33392984677. Remove after 2026-09-01 15:00 Europe/Vienna.
minimumReleaseAgeExclude:
  - '@lupinum/ginko-docs@0.4.0-rc.4'

allowBuilds:
  '@parcel/watcher': true
  better-sqlite3: true
  esbuild: true
  unrs-resolver: true
  vue-demi: true

overrides:
  # Remove these audit pins when normal resolution retains the patched versions.
  'ajv@8>fast-uri': 3.1.6
  'express@5>qs': 6.16.0
  'body-parser@2>qs': 6.16.0
  esbuild: 0.28.1
  sharp: 0.35.0
